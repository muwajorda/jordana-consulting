
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bioinformatics & Compute Readiness Engine</title>
    <!-- Stlite CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.63.0/build/stlite.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e1117;
        color: #ffffff;
      }
      #root {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Stlite JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.63.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas"],
          entrypoint: "app.py",
          files: {
            "app.py": `import streamlit as st

st.set_page_config(page_title="Bioinformatics Readiness Engine", page_icon="🧬", layout="wide")

st.title("🧬 Bioinformatics & Compute Readiness Engine")
st.caption("Audit your pipeline infrastructure, biological QC, and cost scalability in under 2 minutes.")

st.divider()

# Section 1: Target Profile
col1, col2 = st.columns(2)

with col1:
    company_type = st.selectbox(
        "Organization Type",
        [
            "Biotech Startup (Series A/B)",
            "Digital Health / Tele-Genomics Platform",
            "Hospital / Clinical Diagnostic Network (CLIA/CAP)",
            "Academic / Research Institute"
        ]
    )

with col2:
    primary_assay = st.selectbox(
        "Primary Modality / Assay",
        [
            "Cell-free DNA (cfDNA) / Early Detection",
            "Whole Genome Sequencing (WGS) / WES",
            "Epigenetics / ChIP-seq / Methylation",
            "Targeted Gene Panels / PGx"
        ]
    )

# Section 2: Technical & Infrastructure Inputs
st.subheader("Infrastructure & Quality Control")

c1, c2, c3 = st.columns(3)

with c1:
    orchestrator = st.selectbox("Workflow Orchestration", ["Nextflow / Snakemake", "Custom Python/Bash Scripts", "CWL / WDL", "None / Manual"])
with c2:
    containerized = st.radio("Are pipelines containerized?", ["Yes (Docker / Apptainer)", "Partial", "No"])
with c3:
    monthly_data_gb = st.number_input("Est. Monthly Sequencing Data (GB)", min_value=50, max_value=100000, value=1000, step=250)

# Section 3: Biological QC & Compliance
col_a, col_b = st.columns(2)
with col_a:
    has_bio_qc = st.checkbox("Includes automated signal-to-noise / biological QC layers")
with col_b:
    needs_compliance = st.checkbox("Requires HIPAA / CLIA / CAP audit trails")

st.divider()

# Run Audit Button
if st.button("Generate Readiness Report", type="primary"):
    score = 100
    bottlenecks = []
    recommendations = []

    # Scoring Logic
    if orchestrator in ["Custom Python/Bash Scripts", "None / Manual"]:
        score -= 25
        bottlenecks.append("Unstandardized workflow orchestration risks pipeline crashes under scale.")
        recommendations.append("Refactor core processing steps into Nextflow DSL2 or Snakemake for parallel execution.")

    if containerized != "Yes (Docker / Apptainer)":
        score -= 20
        bottlenecks.append("Lack of full containerization compromises execution reproducibility.")
        recommendations.append("Package environment dependencies into version-controlled Docker/Apptainer images.")

    if not has_bio_qc:
        score -= 20
        bottlenecks.append("Missing automated biological QC layers can lead to downstream sample reporting errors.")
        recommendations.append("Implement automated enrichment-to-background QC filters upstream of variant calling.")

    if monthly_data_gb >= 2000:
        bottlenecks.append("High monthly data volume will incur exponential S3/GCP storage costs without lifecycle management.")
        recommendations.append("Configure automated S3 Glacier cold-storage tiering for completed FASTQ/BAM archives.")

    if "Digital Health" in company_type or "Hospital" in company_type:
        if containerized != "Yes (Docker / Apptainer)" or needs_compliance:
            bottlenecks.append("Clinical SLAs require immutable audit trails and guaranteed pipeline uptime.")
            recommendations.append("Set up HIPAA/CLIA-compliant CI/CD container verification and automated sample recovery logging.")

    # Display Results
    st.header(f"Overall Readiness Score: {max(score, 0)} / 100")

    if score >= 80:
        st.success("Your pipeline infrastructure shows strong technical maturity!")
    elif score >= 50:
        st.warning("Moderate readiness. Key operational and cost bottlenecks identified.")
    else:
        st.error("High risk of scalability failure or cloud cost overruns under current setup.")

    st.subheader("Identified Bottlenecks")
    for b in bottlenecks:
        st.write(f"- ⚠️ {b}")

    st.subheader("Recommended Action Plan")
    for r in recommendations:
        st.write(f"- ✅ {r}")

    st.divider()

    # Monetization Lead Capture
    st.info("💡 **Need help implementing these recommendations?**")
    st.markdown("Book a **30-Minute Architecture Deep-Dive** to review your Nextflow scripts, cloud cost structures, and biological QC layers.")
    
    st.link_button("Book Paid Architecture Audit ($499)", "https://stripe.com")
`,
          },
          streamlitConfig: {
            "server.fileWatcherType": "none",
            "theme.base": "dark",
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
