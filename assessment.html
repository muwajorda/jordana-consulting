<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biotech Readiness Assessment Engine</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- stlite CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/style.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-emerald-400 hover:text-emerald-300">
        ← Back to Homepage
      </a>
      <span class="text-sm text-slate-400 font-mono">In-Browser Wasm Engine</span>
    </div>
  </nav>

  <!-- Main Mount Root Container -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="root" class="min-h-[800px] w-full bg-slate-900 rounded-lg border border-slate-800 p-4">
      <div id="status" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-400 mb-4"></div>
        <p class="text-sm font-mono">Loading Pyodide & Streamlit Runtime...</p>
      </div>
    </div>
  </main>

  <!-- stlite Browser Module -->
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.js";

    const pythonAppCode = `
import streamlit as st
import json
from datetime import datetime

# Initialize Session State DB replacement
if "assessments" not in st.session_state:
    st.session_state.assessments = []

st.set_page_config(page_title="Biotech Readiness Engine", layout="centered")

st.title("🧬 Compute & Omics Readiness Engine")
st.caption("Evaluate your bioinformatics architecture, data pipelines, and team readiness.")

tab1, tab2 = st.tabs(["🚀 New Assessment", "📊 Submission Logs"])

with tab1:
    with st.form("assessment_form"):
        st.markdown("#### 1. Company Profile & Focus")
        col1, col2 = st.columns(2)
        with col1:
            company_name = st.text_input("Company / Project Name", value="AstraOmics Bio")
            contact_email = st.text_input("Contact Email", value="founder@astraomics.com")
        with col2:
            team_size = st.number_input("Bioinformatics Headcount", min_value=0, max_value=50, value=2)
            stage = st.selectbox("Company Stage", ["Seed", "Series A", "Series B+", "Academic / Non-Profit"])

        st.markdown("#### 2. Omics Modalities & Data Workloads")
        data_types = st.multiselect(
            "Primary Workloads & Data Types",
            ["Preventive Genomics WGS", "cfDNA / Fragmentomics", "ChIP-seq / Epigenetics", "Bulk RNA-seq", "scRNA-seq", "Oncology Panels"],
            default=["Preventive Genomics WGS", "cfDNA / Fragmentomics"]
        )
        monthly_gb = st.number_input("Estimated Monthly Data Volume (GB)", value=500, step=100)

        st.markdown("#### 3. Infrastructure & Automation")
        col3, col4 = st.columns(2)
        with col3:
            uses_workflows = st.checkbox("Uses Nextflow / Snakemake", value=True)
        with col4:
            uses_containers = st.checkbox("Uses Docker / Apptainer", value=True)

        submitted = st.form_submit_button("Run Assessment Engine 🔥")

    if submitted:
        bottlenecks = []
        recommendations = []

        omics_score = 3
        if "cfDNA / Fragmentomics" in data_types or "ChIP-seq / Epigenetics" in data_types:
            omics_score += 1
            if team_size < 3:
                bottlenecks.append("High-noise omics modalities require biological QC filtering.")
                recommendations.append("Implement automated biological QC layers to filter low-signal samples.")

        if "Preventive Genomics WGS" in data_types:
            omics_score = min(5, omics_score + 1)
            if monthly_gb > 1000:
                bottlenecks.append("Large WGS cohort storage costs escalate rapidly without automated cold-tiering.")
                recommendations.append("Configure automated cloud storage tiering (e.g., S3 Glacier) for raw FASTQ archives.")

        infra_score = 1
        if uses_workflows:
            infra_score += 2
        else:
            bottlenecks.append("Lack of workflow orchestration reduces run reproducibility and error tracking.")
            recommendations.append("Standardize pipelines using Nextflow DSL2 templates for reproducible execution.")

        if uses_containers:
            infra_score += 2
        else:
            bottlenecks.append("Uncontainerized environment increases risk of execution failure.")
            recommendations.append("Package pipeline dependencies into Docker/Apptainer containers.")

        team_score = min(5, max(1, team_size * 2))

        # Store entry in session state
        st.session_state.assessments.append({
            "Company": company_name,
            "Stage": stage,
            "Omics Score": f"{min(5, omics_score)}/5",
            "Infra Score": f"{min(5, infra_score)}/5",
            "Team Score": f"{team_score}/5",
            "Timestamp": datetime.now().strftime("%Y-%m-%d %H:%M")
        })

        st.success("Assessment Computed & Saved to Session!")

        c1, c2, c3 = st.columns(3)
        c1.metric("Omics Readiness", f"{min(5, omics_score)} / 5")
        c2.metric("Infra Readiness", f"{min(5, infra_score)} / 5")
        c3.metric("Team Maturity", f"{team_score} / 5")

        if bottlenecks:
            st.markdown("#### 🚨 Identified Bottlenecks")
            for b in bottlenecks:
                st.warning(f"- {b}")

        if recommendations:
            st.markdown("#### 🚀 Recommended Action Plan")
            for r in recommendations:
                st.info(f"- {r}")

        b_formatted = "\\n".join([f"- {b}" for b in bottlenecks]) if bottlenecks else "- None identified."
        r_formatted = "\\n".join([f"- {r}" for r in recommendations]) if recommendations else "- System configuration meets target requirements."

        report_text = f"# Bioinformatics Readiness Assessment Report\\n**Company:** {company_name}\\n**Email:** {contact_email}\\n**Stage:** {stage}\\n\\n## Readiness Scores\\n- Omics: {min(5, omics_score)} / 5\\n- Infra: {min(5, infra_score)} / 5\\n- Team: {team_score} / 5\\n\\n## Bottlenecks\\n{b_formatted}\\n\\n## Recommendations\\n{r_formatted}\\n"

        st.download_button(
            label="📄 Download Assessment Report (.md)",
            data=report_text,
            file_name=f"{company_name.lower().replace(' ', '_')}_readiness_report.md",
            mime="text/markdown"
        )

with tab2:
    st.markdown("#### 📁 Submission Logs")
    if st.session_state.assessments:
        st.table(st.session_state.assessments)
    else:
        st.info("No assessments submitted in this session yet.")
`;

    try {
      mount(
        {
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": pythonAppCode
          },
          streamlitConfig: {
            "server.fileWatcherType": "none",
            "theme.base": "dark",
            "theme.backgroundColor": "#0f172a",
            "theme.secondaryBackgroundColor": "#1e293b",
            "theme.textColor": "#f8fafc",
            "theme.primaryColor": "#10b981"
          }
        },
        document.getElementById("root")
      );
    } catch (err) {
      document.getElementById("status").innerHTML = `<p class="text-red-400">Failed to mount stlite: ${err.message}</p>`;
    }
  </script>
</body>
</html>
